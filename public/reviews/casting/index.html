hicle and jacket in a future Wiami editorial setting"},{"id":"vehicles-cast-03","category":"vehicles","option":"03","image":"/images/marketplace/casting-review-v1/vehicles-cast-03.webp","position":"50% 55%","productIds":["vehicle-ghostline","JCKT_001"],"alt":"Latina woman, age 24 with the featured Wilder World vehicle and jacket in a future Wiami editorial setting"}]}];
const nav=document.querySelector('.nav'),host=document.getElementById('groups');let selections={};try{selections=JSON.parse(localStorage.getItem('ww-casting-review-v1')||'{}')}catch{}
for(const group of groups){const a=document.createElement('a');a.href='#'+group.id;a.textContent=group.title;nav.append(a);const section=document.createElement('section');section.id=group.id;const h=document.createElement('h2');h.textContent=group.title;section.append(h);const grid=document.createElement('div');grid.className='grid';for(const item of group.items){const article=document.createElement('article');article.dataset.id=item.id;article.dataset.category=group.id;const figure=document.createElement('figure');const img=document.createElement('img');img.src=item.image;img.alt=item.alt;img.loading='lazy';img.style.objectPosition=item.position;figure.append(img);const open=document.createElement('a');open.href=item.image;open.target='_blank';open.rel='noopener';open.className='open';open.textContent='Open image ↗';figure.append(open);article.append(figure);const meta=document.createElement('div');meta.className='meta';const label=document.createElement('div');const num=document.createElement('span');num.className='number';num.textContent='OPTION '+item.option;label.append(num);const strong=document.createElement('strong');strong.textContent=item.label||'New casting';label.append(strong);meta.append(label);const pick=document.createElement('button');pick.textContent='Mark preference';pick.onclick=()=>{if(selections[group.id]===item.id)delete selections[group.id];else selections[group.id]=item.id;localStorage.setItem('ww-casting-review-v1',JSON.stringify(selections));refresh()};meta.append(pick);article.append(meta);grid.append(article)}section.append(grid);host.append(section)}
function refresh(){for(const article of host.querySelectorAll('article')){const active=selections[article.dataset.category]===article.dataset.id;article.classList.toggle('selected',active);const button=article.querySelector('button');button.setAttribute('aria-pressed',String(active));button.textContent=active?'Preferred ✓':'Mark preference'}}refresh();for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>{document.body.classList.toggle('full',button.dataset.view==='full');for(const b of document.querySelectorAll('[data-view]')){b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',String(b===button))}};
